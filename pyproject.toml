[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Operational analytics for IT service requests: SLA risk, workload, and recurring issues."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Used by FastAPI's TestClient. Starlette 1.10 warns that httpx support is
    # deprecated; revisit when FastAPI documents the replacement.
    "httpx>=0.27",
]
# Notebooks and exploratory analysis; not needed to generate or load data.
analysis = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "scipy>=1.13",
]
# Training and evaluating the SLA breach model.
modeling = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]
# Serving the model and verified metrics over HTTP. Includes the modeling
# extra because the API loads the fitted scikit-learn/XGBoost pipeline.
api = [
    "opspilot[modeling]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg-pool>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: integration test that needs the PostgreSQL container (skipped when it is not running)",
]
