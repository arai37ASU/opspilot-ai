# Local PostgreSQL for development and integration tests, and the API.
# Settings come from .env (copy .env.example to .env first).
#
#   docker compose up -d                  database only
#   docker compose --profile api up -d    database and API (build the model first)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only, so the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts here run once, when the data volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    profiles: ["api"]
    environment:
      # Inside the compose network the database is reached by its service
      # name, not 127.0.0.1 as in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPSPILOT_MODEL_DIR: /app/models
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # Built by `python -m opspilot.modeling.train`; read-only in the container.
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
