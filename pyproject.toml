[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "Operational analytics for IT service requests: SLA risk, workload, and recurring issues."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Notebooks and exploratory analysis; not needed to generate or load data.
analysis = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "scipy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: integration test that needs the PostgreSQL container (skipped when it is not running)",
]
